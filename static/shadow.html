<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shadow — Estratégias em Teste</title>
<style>
  :root{--navy:#1F3864;--green:#2E7D32;--red:#C0392B;--bg:#0f1420;--card:#171e2e;--line:#26304a;--txt:#e8edf6;--mut:#9aa6bd}
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--txt);padding:18px 22px 60px}
  h1{font-size:22px;margin:0;color:#fff}h1 span{color:#7db8ff}
  .sub{color:var(--mut);font-size:12.5px;margin:4px 0 18px}
  .wrap{max-width:1200px;margin:0 auto}
  .strat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .shead{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:10px}
  .shead .nome{font-size:16px;font-weight:700;color:#cfe0ff}
  .kpi{font-size:12px;color:var(--mut)} .kpi b{color:var(--txt);font-size:14px}
  .g{color:#4ade80}.r{color:#f87171}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  th,td{padding:5px 9px;text-align:right;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--mut);font-weight:600;font-size:10.5px;text-transform:uppercase}
  tr.open td{background:#15243a}
  .pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10.5px;font-weight:700}
  .pill.open{background:#1e3a5f;color:#7db8ff}.pill.closed{background:#1c2436;color:#9fb0c9}
  .muted{color:var(--mut);font-size:11.5px}
  .foot{color:#5b6472;font-size:11px;margin-top:22px;border-top:1px solid var(--line);padding-top:10px}
  .tot{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .tcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 15px;flex:1;min-width:140px}
  .tcard .l{color:var(--mut);font-size:11px;text-transform:uppercase}.tcard .v{font-size:22px;font-weight:700;margin-top:3px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Shadow <span>— Estratégias em Teste</span></h1>
  <div class="sub" id="sub">carregando…</div>
  <div class="tot" id="tot"></div>
  <div id="strats"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const API_BASE=(location.hostname.includes('railway.app')||location.hostname==='localhost')?'':'https://diligent-spirit-production.up.railway.app';
const $=s=>document.querySelector(s);
const money=(v,m)=>(v>=0?'+':'')+(m==='BRL'?'R$ ':'US$ ')+Math.round(v).toLocaleString('pt-BR');
const cls=v=>v>=0?'g':'r';
async function jget(u){const r=await fetch(API_BASE+u,{credentials:'omit'});if(!r.ok)throw new Error(u+' '+r.status);return r.json();}

function tradeRows(t,moeda){
  if(!t||!t.length) return '<tr><td colspan="7" class="muted">nenhuma trade</td></tr>';
  return t.map(x=>{
    const op=(x.status||'').toUpperCase()==='OPEN';
    return `<tr class="${op?'open':''}">
      <td>${x.sym||'—'}</td>
      <td>${x.dir||'—'}</td>
      <td><span class="pill ${op?'open':'closed'}">${x.status||''}</span></td>
      <td>${x.entry!=null?Number(x.entry).toLocaleString('pt-BR'):'—'}</td>
      <td class="${op&&x.parcial!=null?cls(x.parcial):''}">${op?(x.parcial!=null?money(x.parcial,moeda):'<span class="muted">sem preço</span>'):'—'}</td>
      <td class="${cls(x.pnl||0)}">${!op&&x.pnl!=null?money(x.pnl,moeda):'—'}</td>
      <td class="muted">${x.opened?String(x.opened).slice(5,16).replace('T',' '):'—'}</td>
    </tr>`;}).join('');
}
function stratCard(s){
  if(s.erro) return `<div class="strat"><div class="nome">${s.nome}</div><div class="muted">indisponível: ${s.erro}</div></div>`;
  return `<div class="strat">
    <div class="shead">
      <div class="nome">${s.nome}</div>
      <div class="kpi">abertas <b class="${s.abertas>0?'g':''}">${s.abertas}</b></div>
      <div class="kpi">fechadas <b>${s.fechadas}</b></div>
      <div class="kpi">WR <b>${s.wr}%</b></div>
      <div class="kpi">P&L realizado <b class="${cls(s.pnl)}">${money(s.pnl,s.moeda)}</b></div>
      ${s.abertas>0?`<div class="kpi">P&L parcial (abertas) <b class="${cls(s.parcial_abertas||0)}">${money(s.parcial_abertas||0,s.moeda)}</b></div>`:''}
    </div>
    <table><thead><tr><th>Ativo/Par</th><th>Dir</th><th>Status</th><th>Entrada</th><th>Parcial (aberta)</th><th>P&L (fechada)</th><th>Aberta em</th></tr></thead>
    <tbody>${tradeRows(s.trades,s.moeda)}</tbody></table>
  </div>`;
}
function limonadaCard(d){
  if(!d||d.error) return '';
  const b=(d.books&&d.books.ALL)||{}, cap=d.capital||{};
  return `<div class="strat" style="border-color:#7a5a1f">
    <div class="shead"><div class="nome">🍋 Limonada (perna long da Arbi)</div>
      <div class="kpi">trades <b>${d.total_registrados||0}</b></div>
      <div class="kpi">WR <b>${b.wr!=null?b.wr+'%':'—'}</b></div>
      <div class="kpi">ret/trade <b class="${cls(b.ret_med||0)}">${b.ret_med!=null?(b.ret_med>=0?'+':'')+b.ret_med+'%':'—'}</b></div>
      <div class="kpi">P&L (US$100k) <b class="${cls(b.pnl_usd||0)}">${b.pnl_usd!=null?money(b.pnl_usd,'USD'):'—'}</b></div>
      <div class="kpi">ret s/ capital <b class="${cls(b.ret_sobre_capital_pct||0)}">${b.ret_sobre_capital_pct!=null?(b.ret_sobre_capital_pct>=0?'+':'')+b.ret_sobre_capital_pct+'%':'—'}</b></div>
    </div>
    <div class="muted">7 books em teste · detalhe completo na aba 🍋 Limonada</div>
  </div>`;
}
function momentumCard(d){
  if(!d||d.error) return '';
  const rows=(d.por_reason)?Object.entries(d.por_reason).map(([k,v])=>
    `<tr><td>${k}</td><td>${v.n}</td><td class="${cls(v.pnl)}">${money(v.pnl,'BRL')}</td></tr>`).join(''):'';
  const openRows=(d.trades||[]).map(t=>
    `<tr style="background:#0e1c2e"><td>${t.pair_id}</td><td>${(t.dir||'').replace('MOM_','')}</td>`+
    `<td>z ${t.entry_z!=null?(+t.entry_z).toFixed(2):'—'}→${t.current_z!=null?(+t.current_z).toFixed(2):'—'}</td>`+
    `<td class="${cls(t.parcial||0)}">${money(t.parcial||0,'BRL')}</td></tr>`).join('');
  return `<div class="strat" style="border-color:#5a3f7a">
    <div class="shead"><div class="nome">🔄 Pairs Momentum (teste: "virar o lado")</div>
      <div class="kpi">abertas <b>${d.abertas||0}</b></div>
      <div class="kpi">fechadas <b>${d.fechadas||0}</b></div>
      <div class="kpi">WR <b>${d.wr!=null?d.wr+'%':'—'}</b></div>
      <div class="kpi">P&L fechado <b class="${cls(d.pnl_fechado||0)}">${money(d.pnl_fechado||0,'BRL')}</b></div>
      ${d.abertas>0?`<div class="kpi">parcial <b class="${cls(d.pnl_parcial_aberto||0)}">${money(d.pnl_parcial_aberto||0,'BRL')}</b></div>`:''}
    </div>
    <div class="muted">Abre trade invertida (segue tendência) quando o fade é bloqueado por regime/cooldown. Só shadow. ⚠︎ Não compare P&L fechado com parcial de abertas (coortes diferentes) — veredito só com ~100 fechadas.</div>
    ${(rows||openRows)?`<table><thead><tr><th>Motivo saída / Par aberto</th><th>n / dir</th><th>P&L / z</th><th></th></tr></thead><tbody>${rows}${openRows}</tbody></table>`:''}
  </div>`;
}
function v2Card(d){
  if(!d||d.error||!d.books) return '';
  const f=d.formation||{};
  const funil=(f.pares||[]).filter(p=>p.tier==='NUCLEO'||p.tier==='PROVACAO')
    .map(p=>`${p.pair}(${p.tier==='NUCLEO'?'N':'P'})`).join(' · ');
  let rows='';
  for(const [bk,s] of Object.entries(d.books)){
    rows+=`<tr><td><b>Book ${bk}</b><br><span class="muted" style="font-size:11px">${s.regra||''}</span></td>
      <td>${s.abertas||0} abertas / ${s.fechadas||0} fechadas</td>
      <td>${s.wr!=null?s.wr+'%':'—'}</td>
      <td class="${cls(s.pnl_fechado||0)}">${money(s.pnl_fechado||0,'BRL')}</td>
      <td class="${cls(s.parcial_abertas||0)}">${money(s.parcial_abertas||0,'BRL')}</td></tr>`;
    (s.trades_abertas||[]).forEach(t=>{
      rows+=`<tr style="background:#0e1c2e"><td style="padding-left:18px">${t.pair}</td><td>${t.dir}</td>
        <td>z ${t.entry_z!=null?(+t.entry_z).toFixed(2):'—'}</td><td></td>
        <td class="${cls(t.parcial||0)}">${money(t.parcial||0,'BRL')}</td></tr>`;});
  }
  return `<div class="strat" style="border-color:#2e6b4f">
    <div class="shead"><div class="nome">🧪 Pairs B3 v2 (desenho do conselho)</div>
      <div class="kpi">funil <b>${f.n_nucleo||0}N + ${f.n_provacao||0}P</b></div>
      <div class="kpi muted" style="font-size:11px">${f.fonte||''}</div>
    </div>
    <div class="muted">Universo vivo (formação semanal) · saída ±0,5 · stop de tese · timeout 3×half-life (teto 5 pregões). Pares: ${funil||'—'}</div>
    <table><thead><tr><th>Book / regra</th><th>Trades</th><th>WR</th><th>P&L fechado</th><th>Parcial</th></tr></thead>
    <tbody>${rows}</tbody></table>
  </div>`;
}
function swapCfCard(d){
  if(!d||d.error) return '';
  return `<div class="strat" style="border-color:#6b5a2e">
    <div class="shead"><div class="nome">⚖️ Swap: teste do contrafactual</div>
      <div class="kpi">abertos <b>${d.abertos||0}</b></div>
      <div class="kpi">fechados <b>${d.fechados||0}</b></div>
      <div class="kpi">swap venceu <b>${d.swap_adicionou_valor_n||0}/${d.fechados||0}</b></div>
      <div class="kpi">Δ total <b class="${cls(d.delta_total||0)}">${money(d.delta_total||0,'BRL')}</b></div>
    </div>
    <div class="muted">Toda trade fechada por SWAP ganha uma cópia virtual que continua até a saída original. Δ>0 = trocar foi melhor que segurar (teste do viés apontado pelo GPT).</div>
  </div>`;
}
function fdur(m){ if(m==null) return '—'; if(m>=1440){var d=Math.floor(m/1440),h=Math.floor((m%1440)/60);return d+'d'+(h?' '+h+'h':'');} if(m>=60){var h=Math.floor(m/60);return h+'h'+(m%60?' '+(m%60)+'m':'');} return m+'m'; }
function rvPct(p){ if(p==null) return '—'; return '<span class="'+(p>=0?'g':'r')+'">'+(p>=0?'+':'')+p.toFixed(2)+'%</span>'; }
function rvTradeRows(b){
  var rows='';
  (b.open||[]).forEach(function(o){
    rows+='<tr class="open"><td>'+o.pair+'</td><td>'+(o.dir||'')+'</td>'+
      '<td><span class="pill open">ABERTA</span></td>'+
      '<td>'+(o.entry_z!=null?(+o.entry_z).toFixed(2):'—')+'→'+(o.cur_z!=null?(+o.cur_z).toFixed(2):'—')+'</td>'+
      '<td class="muted">'+fdur(o.dur_min)+'</td>'+
      '<td class="'+cls(o.mtm||0)+'">'+(o.mtm!=null?money(o.mtm,'USD'):'<span class="muted">sem preço</span>')+
        (o.px_live?' <span class="muted" style="font-size:9px" title="cotação ao vivo">•live</span>':' <span class="muted" style="font-size:9px" title="preço da última varredura do motor">•scan</span>')+'</td>'+
      '<td>'+rvPct(o.pnl_pct)+'</td></tr>';
  });
  (b.closed||[]).forEach(function(o){
    rows+='<tr><td>'+o.pair+' <span class="muted" style="font-size:10px">'+(o.reason||'')+'</span></td><td>'+(o.dir||'')+'</td>'+
      '<td><span class="pill closed">FECHADA</span></td>'+
      '<td class="muted">—</td>'+
      '<td class="muted">'+fdur(o.dur_min)+'</td>'+
      '<td class="'+cls(o.pnl||0)+'">'+(o.pnl!=null?money(o.pnl,'USD'):'—')+'</td>'+
      '<td>'+rvPct(o.pnl_pct)+'</td></tr>';
  });
  return rows||'<tr><td colspan="7" class="muted">nenhuma trade</td></tr>';
}
function rvBookCard(b){
  if(!b||b.error) return '';
  // [04-ago] capital-base = max de posicoes SIMULTANEAS x (perna A + perna B).
  // Antes mostrava so o notional de 1 perna e dividia o book inteiro por ele.
  var capTxt=b.capital!=null
    ? 'capital-base US$ '+Math.round(b.capital).toLocaleString('pt-BR')
      +' ('+(b.max_simult||0)+' posições simultâneas no pico × as 2 pernas)'
    : '';
  var scan=b.last_scan?new Date(b.last_scan).toLocaleString('pt-BR'):'—';
  return '<div class="strat" style="border-color:#2e5a7a">'+
    '<div class="shead"><div class="nome">'+b.name+'</div>'+
    '<div class="kpi">abertas <b class="'+(b.n_open>0?'g':'')+'">'+b.n_open+'</b></div>'+
    '<div class="kpi">fechadas <b>'+b.n_closed+'</b></div>'+
    '<div class="kpi">WR <b>'+(b.wr!=null?b.wr+'%':'—')+'</b></div>'+
    '<div class="kpi">P&L realizado <b class="'+cls(b.realized||0)+'">'+money(b.realized||0,'USD')+'</b></div>'+
    (b.n_open>0?'<div class="kpi">P&L parcial <b class="'+cls(b.unreal||0)+'">'+money(b.unreal||0,'USD')+'</b></div>':'')+
    '<div class="kpi">Total <b class="'+cls(b.total||0)+'">'+money(b.total||0,'USD')+'</b></div>'+
    '<div class="kpi">% s/ capital <b class="'+cls(b.total_pct||0)+'">'+(b.total_pct!=null?(b.total_pct>=0?'+':'')+b.total_pct.toFixed(2)+'%':'—')+'</b></div>'+
    '</div>'+
    '<div class="muted">'+capTxt+' · última varredura do motor '+scan+
      (b.n_open>0?' · P&L marcado a mercado: <b>'+(b.px_live_n||0)+'/'+b.n_open+' ao vivo</b>':'')+
      ' <span style="font-size:10px">(a decisão de abrir/fechar segue a varredura; o P&L acompanha o preço atual)</span></div>'+
    '<table><thead><tr><th>Par</th><th>Dir</th><th>Status</th><th>z ent→atual</th><th>Duração</th><th>P&amp;L</th><th>% s/ cap</th></tr></thead>'+
    '<tbody>'+rvTradeRows(b)+'</tbody></table>'+
    '</div>';
}
function rvBooksSection(rv){
  if(!rv||rv.error) return '';
  var head='<div style="margin:22px 0 10px;color:#7db8ff;font-weight:700;font-size:14px">Arbitragem Estatística (Relative Value) — books em sombra</div>';
  return head+rvBookCard(rv.uspairs)+rvBookCard(rv.crossasset)+rvBookCard(rv.cryptorv);
}
async function load(){
  try{
    const d=await jget('/public/shadow');
    let rv=null; try{ rv=await jget('/shadow/rv-status'); }catch(e){ rv=null; }
    // totais
    let openTot=0,closedTot=0;
    (d.strategies||[]).forEach(s=>{openTot+=(s.abertas||0);closedTot+=(s.fechadas||0);});
    $('#tot').innerHTML=[
      ['Estratégias em teste',(d.strategies||[]).length+(d.limonada&&!d.limonada.error?1:0)],
      ['Trades abertas agora',openTot],
      ['Trades fechadas (total)',closedTot.toLocaleString('pt-BR')],
    ].map(c=>`<div class="tcard"><div class="l">${c[0]}</div><div class="v">${c[1]}</div></div>`).join('');
    let html=rvBooksSection(rv)+v2Card(d.pairs_v2)+limonadaCard(d.limonada)+momentumCard(d.pairs_momentum)+swapCfCard(d.swap_counterfactual);
    (d.strategies||[]).sort((a,b)=>(b.abertas||0)-(a.abertas||0)).forEach(s=>html+=stratCard(s));
    $('#strats').innerHTML=html;
    $('#sub').textContent='atualizado '+new Date().toLocaleTimeString('pt-BR')+' · atualiza sozinho a cada 45s · linhas azuladas = trades ABERTAS';
    $('#foot').textContent='Fonte: /public/shadow · books em paper/shadow (sem capital real) · moeda por estratégia (R$ B3, US$ demais)';
  }catch(e){$('#sub').textContent='erro: '+e.message;}
}
load(); setInterval(load,45000);
</script>
</body>
</html>
